name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: make test

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
        working-directory: console
      # `npm run build` runs tsc, then the parity test that holds the TypeScript
      # model to the Python one, then the bundle. The parity test reads the
      # committed golden fixture, so this job needs no Python.
      - run: npm run build
        working-directory: console
        env:
          VITE_BASE: /
